; PlatformIO is the build-verification vehicle (`pio run`); `idf.py build` builds the same tree.
[platformio]
src_dir = main

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 921600
monitor_filters = esp32_exception_decoder
; The ESP32-S3 modules this targets have at least 4 MB of flash; partitions.csv lays out 4 MB.
board_upload.flash_size = 4MB
board_build.partitions = partitions.csv
