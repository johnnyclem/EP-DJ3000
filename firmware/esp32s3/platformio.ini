; PlatformIO is the build-verification vehicle (`pio run`); `idf.py build` builds the same tree.
[platformio]
src_dir = main

[env:esp32s3]
; Pinned to the release that produced the verified build (ESP-IDF 6.1.0, GCC 15.2.0, esptool 5.4.0, PlatformIO
; Core 6.2.0). An unpinned platform follows new releases and swaps the toolchain under you.
platform = espressif32@8.0.0
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 921600
monitor_filters = esp32_exception_decoder
; The ESP32-S3 modules this targets have at least 4 MB of flash; partitions.csv lays out 4 MB.
board_upload.flash_size = 4MB
board_build.partitions = partitions.csv
